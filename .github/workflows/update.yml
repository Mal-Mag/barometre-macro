name: Mise à jour du baromètre

on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u barometre.py
      - name: Publier les données
        run: |
          git config user.name "barometre-bot"
          git config user.email "barometre-bot@users.noreply.github.com"
          git add data.js csv_manuels
          git diff --cached --quiet || git commit -m "Mise à jour des données"
          git push
